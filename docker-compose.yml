# Cluster local: HDFS (1 NameNode + 1 DataNode) y Spark (1 master + 1 worker)
# Levantar:  docker compose up -d
# Apagar:    docker compose down   (los datos de HDFS se conservan en los volumenes)
name: radar-incendios

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"   # Interfaz web de HDFS
      - "9000:9000"   # Puerto de HDFS
    environment:
      - CLUSTER_NAME=radar
    env_file: hadoop.env
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./data:/data   # Carpeta data/ del repo, para subir archivos a HDFS

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file: hadoop.env
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    depends_on:
      - namenode

  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Interfaz web de Spark
      - "7077:7077"
    environment:
      - HADOOP_USER_NAME=root
    volumes:
      - ./:/opt/proyecto   # Todo el repo queda visible dentro del contenedor

  spark-worker:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - HADOOP_USER_NAME=root
    volumes:
      - ./:/opt/proyecto
    depends_on:
      - spark-master

volumes:
  hdfs_namenode:
  hdfs_datanode:
